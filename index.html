<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Bao Tay Thủy Dương - Găng Tay Bảo Hộ</title>
    <meta name="description" content="Bao tay len bảo hộ lao động, găng tay chống cắt, phủ nhựa. Sản xuất trực tiếp, giá sỉ. LH 033 444 9494 hoặc Zalo 0981 171 750">
    <meta name="keywords" content="bao tay bảo hộ, bao tay len, găng tay Thủy Dương">
    <meta name="author" content="Bao Tay Thủy Dương">
    <link rel="canonical" href="https://baotaythuydung.github.io/BaoTayThuyDuong/">
    <meta property="og:title" content="Bao Tay Thủy Dương - Bảo Hộ Lao Động">
    <meta property="og:description" content="Chuyên cung cấp bao tay len, găng tay chống cắt, giá xưởng. Giao nhanh toàn quốc.">
    <meta property="og:image" content="https://placehold.co/1200x630/0F4C81/white?text=Bao+Tay+Thủy+Dương">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #f9fafb; }
        .btn-cta { background-color: #FF8C00; transition: all 0.2s; }
        .btn-cta:hover { background-color: #e07c00; transform: translateY(-2px); }
        .product-card { transition: all 0.2s; border-radius: 20px; }
        .product-card:hover { box-shadow: 0 20px 25px -12px rgba(0,0,0,0.15); transform: translateY(-4px); }
        .cart-badge { top: -8px; right: -8px; }
        @media (max-width: 768px) {
            .header-main { flex-direction: column; text-align: center; }
            .menu-bar { flex-wrap: wrap; justify-content: center; gap: 0.75rem; }
            .phone-area { justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- HEADER: Logo & Slogan căn giữa, Menu căn giữa, Số điện thoại bên phải -->
    <header class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4">
            <!-- Hàng trên: Logo trung tâm, số điện thoại bên phải -->
            <div class="header-main flex flex-wrap items-center justify-between gap-4">
                <!-- Khoảng trống bên trái để cân bằng với số điện thoại -->
                <div class="w-20 md:w-32"></div>
                
                <!-- Logo và slogan ở giữa -->
                <div class="text-center flex-1">
                    <div class="text-4xl md:text-5xl font-bold">
                        <span class="text-[#FF8C00]">Bao Tay</span>
                        <span class="text-[#0F4C81]"> Thủy Dương</span>
                    </div>
                    <div class="text-lg md:text-xl text-gray-600 mt-2 font-medium">Bao Tay an toàn - Giá cả hợp lý</div>
                </div>

                <!-- 2 số điện thoại bên phải, mỗi số có icon phone + Zalo -->
                <div class="phone-area flex flex-col items-end space-y-2 w-20 md:w-32">
                    <div class="flex items-center gap-2">
                        <a href="tel:0334449494" class="text-[#0F4C81] font-bold text-base md:text-lg"><i class="fas fa-phone-alt mr-1"></i> 033 444 9494</a>
                        <a href="https://zalo.me/0981171750" class="text-[#0068FF] text-xl"><i class="fab fa-zalo"></i></a>
                    </div>
                    <div class="flex items-center gap-2">
                        <a href="tel:0981171750" class="text-[#0F4C81] font-bold text-base md:text-lg"><i class="fas fa-phone-alt mr-1"></i> 0981 171 750</a>
                        <a href="https://zalo.me/0981171750" class="text-[#0068FF] text-xl"><i class="fab fa-zalo"></i></a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Thanh menu ngang căn giữa, chữ to -->
        <div class="bg-gray-50 border-t border-gray-200">
            <div class="container mx-auto px-4">
                <nav class="menu-bar flex justify-center space-x-6 md:space-x-10 py-4 text-base md:text-lg font-semibold">
                    <a href="#" data-page="home" class="nav-link text-gray-700 hover:text-[#FF8C00] transition">Trang chủ</a>
                    <a href="#" data-page="products" class="nav-link text-gray-700 hover:text-[#FF8C00] transition">Sản phẩm</a>
                    <a href="#" data-page="quote" class="nav-link text-gray-700 hover:text-[#FF8C00] transition">Báo giá sỉ</a>
                    <a href="#" data-page="news" class="nav-link text-gray-700 hover:text-[#FF8C00] transition">Tin tức</a>
                    <a href="#" data-page="about" class="nav-link text-gray-700 hover:text-[#FF8C00] transition">Giới thiệu</a>
                    <a href="#" data-page="contact" class="nav-link text-gray-700 hover:text-[#FF8C00] transition">Liên hệ</a>
                </nav>
            </div>
        </div>
    </header>

    <main id="appContent" class="min-h-screen"></main>

    <!-- GIỎ HÀNG DRAWER -->
    <div id="cartDrawer" class="fixed top-0 right-0 w-full md:w-96 h-full bg-white shadow-2xl z-[1000] transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-4 border-b flex justify-between items-center bg-[#0F4C81] text-white">
            <h3 class="text-xl font-bold"><i class="fas fa-shopping-cart mr-2"></i> Giỏ hàng</h3>
            <button id="closeCartBtn" class="text-2xl">&times;</button>
        </div>
        <div id="cartItemsList" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        <div class="border-t p-4 bg-gray-50">
            <div class="flex justify-between font-bold text-lg mb-3"><span>Tổng:</span><span id="cartTotal">0₫</span></div>
            <button id="checkoutBtn" class="w-full btn-cta text-white py-3 rounded-lg font-bold text-lg">Thanh toán ngay</button>
            <p class="text-xs text-gray-500 mt-2 text-center">COD, chuyển khoản, QR</p>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-[1100]">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 mx-4">
            <h3 class="text-2xl font-bold mb-4">Thông tin đặt hàng</h3>
            <form id="checkoutForm">
                <input type="text" placeholder="Họ tên" required class="w-full border p-3 rounded mb-3 text-base">
                <input type="tel" placeholder="Số điện thoại" required class="w-full border p-3 rounded mb-3 text-base">
                <input type="text" placeholder="Địa chỉ" required class="w-full border p-3 rounded mb-3 text-base">
                <textarea placeholder="Ghi chú" rows="2" class="w-full border p-3 rounded mb-3 text-base"></textarea>
                <div class="flex gap-3">
                    <button type="submit" class="flex-1 btn-cta text-white py-2 rounded text-lg">Xác nhận</button>
                    <button type="button" id="closeCheckout" class="flex-1 bg-gray-300 rounded text-lg">Hủy</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Floating Zalo + Phone (bỏ Messenger) -->
    <div class="fixed bottom-6 right-4 flex flex-col gap-3 z-50">
        <a href="https://zalo.me/0981171750" class="bg-[#0068FF] text-white p-3 rounded-full shadow-lg text-2xl w-12 h-12 flex items-center justify-center"><i class="fab fa-zalo"></i></a>
        <a href="tel:0334449494" class="bg-[#0F4C81] text-white p-3 rounded-full shadow-lg text-2xl w-12 h-12 flex items-center justify-center"><i class="fas fa-phone-alt"></i></a>
    </div>

    <script>
        // Dữ liệu sản phẩm mẫu
        const products = [
            { id: 1, name: "Bao tay len 40g - Cao cấp", price: 8500, category: "len", stock: 1500, image: "https://placehold.co/400x400/0F4C81/white?text=Len+40g", rating: 4.8, featured: true },
            { id: 2, name: "Bao tay phủ hạt nhựa", price: 15900, category: "hat-nhua", stock: 890, image: "https://placehold.co/400x400/FF8C00/white?text=Phủ+Hạt+Nhựa", rating: 4.9, featured: true },
            { id: 3, name: "Găng tay chống cắt cấp 5", price: 45000, category: "chong-cat", stock: 340, image: "https://placehold.co/400x400/d32f2f/white?text=Chống+Cắt", rating: 5.0, featured: true },
            { id: 4, name: "Bao tay phủ PU mỏng", price: 18900, category: "phu-pu", stock: 2100, image: "https://placehold.co/400x400/2e7d32/white?text=Phủ+PU", rating: 4.7 },
            { id: 5, name: "Bao tay cotton tráng nhựa", price: 6900, category: "cotton", stock: 3000, image: "https://placehold.co/400x400/795548/white?text=Cotton", rating: 4.5, featured: true },
            { id: 6, name: "Bao tay len chống trơn", price: 12500, category: "len", stock: 950, image: "https://placehold.co/400x400/1565C0/white?text=Chống+Trơn", rating: 4.8, featured: true }
        ];
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let currentPage = 'home';

        function formatPrice(price) { return price.toLocaleString('vi-VN') + '₫'; }
        function saveCart() { localStorage.setItem('cart', JSON.stringify(cart)); updateCartUI(); }
        function updateCartUI() { 
            let count = cart.reduce((s, i) => s + i.quantity, 0);
            if(document.getElementById('cartCount')) document.getElementById('cartCount').innerText = count;
            renderCartItems();
        }
        function renderCartItems() {
            const container = document.getElementById('cartItemsList');
            if(!container) return;
            if(cart.length === 0) { container.innerHTML = '<div class="text-center text-gray-500 py-8 text-lg">Giỏ hàng trống</div>'; document.getElementById('cartTotal').innerText = '0₫'; return; }
            let total = 0;
            let html = '';
            cart.forEach((item) => {
                const prod = products.find(p => p.id === item.id);
                if(!prod) return;
                const itemTotal = prod.price * item.quantity;
                total += itemTotal;
                html += `<div class="flex gap-3 border-b pb-3">
                            <img src="${prod.image}" class="w-16 h-16 object-cover rounded">
                            <div class="flex-1"><p class="font-semibold text-base">${prod.name}</p><p class="text-sm">${formatPrice(prod.price)}</p>
                            <div class="flex items-center gap-2 mt-1"><button class="cart-qty-minus bg-gray-200 px-2 rounded" data-id="${prod.id}">-</button><span class="mx-1">${item.quantity}</span><button class="cart-qty-plus bg-gray-200 px-2 rounded" data-id="${prod.id}">+</button><button class="text-red-500 text-sm ml-2 remove-item" data-id="${prod.id}"><i class="fas fa-trash-alt"></i></button></div></div>
                            <div class="font-bold">${formatPrice(itemTotal)}</div>
                        </div>`;
            });
            container.innerHTML = html;
            document.getElementById('cartTotal').innerText = formatPrice(total);
            document.querySelectorAll('.cart-qty-minus').forEach(btn => btn.addEventListener('click', (e) => { let id = parseInt(btn.dataset.id); adjustQuantity(id, -1); }));
            document.querySelectorAll('.cart-qty-plus').forEach(btn => btn.addEventListener('click', (e) => { let id = parseInt(btn.dataset.id); adjustQuantity(id, 1); }));
            document.querySelectorAll('.remove-item').forEach(btn => btn.addEventListener('click', (e) => { let id = parseInt(btn.dataset.id); cart = cart.filter(i => i.id !== id); saveCart(); }));
        }
        function adjustQuantity(id, delta) { let idx = cart.findIndex(i => i.id === id); if(idx !== -1) { cart[idx].quantity += delta; if(cart[idx].quantity <= 0) cart.splice(idx,1); saveCart(); } }
        function addToCart(id, qty=1) { let existing = cart.find(i => i.id === id); if(existing) existing.quantity += qty; else cart.push({ id, quantity: qty }); saveCart(); showToast("✅ Đã thêm vào giỏ!"); }
        function showToast(msg) { let toast = document.createElement('div'); toast.className = "fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-5 py-2 rounded-lg z-[1200] text-base"; toast.innerText = msg; document.body.appendChild(toast); setTimeout(()=>toast.remove(),2000); }

        function renderProductList(filterCategory = "all", searchQuery = "") {
            let filtered = products.filter(p => (filterCategory === "all" || p.category === filterCategory) && p.name.toLowerCase().includes(searchQuery.toLowerCase()));
            const container = document.getElementById('productGridContainer');
            if(!container) return;
            if(filtered.length===0) { container.innerHTML = '<div class="col-span-full text-center py-12 text-lg">Không tìm thấy sản phẩm</div>'; return;}
            container.innerHTML = filtered.map(p => `
                <div class="product-card bg-white rounded-xl shadow-md p-4 hover:shadow-lg">
                    <img src="${p.image}" class="w-full h-48 object-cover rounded-lg mb-3" loading="lazy">
                    <h3 class="font-bold text-xl text-[#0F4C81]">${p.name}</h3>
                    <div class="flex items-center gap-1 text-yellow-500 text-sm"><i class="fas fa-star"></i> ${p.rating}</div>
                    <p class="text-red-600 font-bold text-2xl mt-1">${formatPrice(p.price)}</p>
                    <div class="flex gap-2 mt-3"><button class="btn-add-cart bg-[#0F4C81] text-white px-3 py-2 rounded-full text-sm flex-1"><i class="fas fa-cart-plus"></i> Mua ngay</button><button class="view-detail-btn border border-[#FF8C00] text-[#FF8C00] px-3 py-2 rounded-full text-sm" data-id="${p.id}">Chi tiết</button></div>
                </div>
            `).join('');
            document.querySelectorAll('.btn-add-cart').forEach(btn => btn.addEventListener('click', (e) => { let id = parseInt(btn.closest('.product-card')?.querySelector('.view-detail-btn')?.dataset.id); if(id) addToCart(id,1); }));
            document.querySelectorAll('.view-detail-btn').forEach(btn => btn.addEventListener('click', (e) => { showProductDetail(parseInt(btn.dataset.id)); }));
        }

        function showProductDetail(productId){
            const prod = products.find(p => p.id === productId);
            if(!prod) return;
            const modalDiv = document.createElement('div');
            modalDiv.className = "fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[1200] p-4";
            modalDiv.innerHTML = `<div class="bg-white max-w-3xl w-full rounded-2xl overflow-auto max-h-[90vh]">
                <div class="sticky top-0 bg-white p-4 border-b flex justify-between items-center"><h3 class="font-bold text-2xl">${prod.name}</h3><button class="close-modal text-3xl">&times;</button></div>
                <div class="p-5 grid md:grid-cols-2 gap-5">
                    <img src="${prod.image}" class="rounded-lg w-full">
                    <div><p class="text-3xl font-bold text-[#FF8C00]">${formatPrice(prod.price)}</p><p class="text-sm text-green-600">✔ Tồn kho: ${prod.stock}+</p><div class="mt-4 flex gap-3"><button class="btn-add-cart-modal bg-[#0F4C81] text-white px-6 py-2 rounded-full text-lg">Mua ngay</button><button onclick="window.location.href='tel:0334449494'" class="bg-[#FF8C00] text-white px-6 py-2 rounded-full text-lg">Gọi báo giá</button></div><div class="mt-4"><p class="font-semibold text-base">Sản phẩm chất lượng công nghiệp, bảo hành 30 ngày.</p></div></div>
                </div>
            </div>`;
            document.body.appendChild(modalDiv);
            modalDiv.querySelector('.close-modal').onclick = () => modalDiv.remove();
            modalDiv.querySelector('.btn-add-cart-modal').onclick = () => { addToCart(prod.id, 1); modalDiv.remove(); };
        }

        // Trang chủ đã bỏ video và testimonial
        function renderHome() {
            const featured = products.filter(p => p.featured);
            return `
            <section class="bg-gradient-to-r from-[#0F4C81] to-[#0b3a62] text-white py-16 md:py-24">
                <div class="container mx-auto px-4 flex flex-col md:flex-row items-center gap-8">
                    <div class="md:w-1/2"><h1 class="text-4xl md:text-6xl font-bold leading-tight">BAO TAY LEN BẢO HỘ LAO ĐỘNG<br><span class="text-[#FF8C00]">Chống trơn – Êm tay – Giá xưởng</span></h1><p class="mt-4 text-xl">Sản xuất trực tiếp, giá sỉ toàn quốc, nhận OEM. Giao hàng nhanh.</p><div class="mt-8 flex gap-4"><a href="#" data-page="products" class="btn-cta text-white px-8 py-4 rounded-lg font-bold text-lg">Xem sản phẩm</a><button id="getQuoteBtn" class="border-2 border-white px-8 py-4 rounded-lg font-bold text-lg">Nhận báo giá sỉ</button></div></div>
                    <div class="md:w-1/2"><img src="https://placehold.co/600x400/FFFFFF/0F4C81?text=Găng+tay+Thủy+Dương" alt="Bao tay Thủy Dương" class="rounded-2xl shadow-xl"></div>
                </div>
            </section>
            <div class="bg-white py-10 shadow-sm"><div class="container mx-auto grid grid-cols-2 md:grid-cols-4 gap-6 text-center"><div><i class="fas fa-truck-fast text-4xl text-[#0F4C81]"></i><p class="font-bold text-lg mt-2">Giao hàng toàn quốc</p></div><div><i class="fas fa-factory text-4xl text-[#0F4C81]"></i><p class="font-bold text-lg mt-2">Sản xuất trực tiếp</p></div><div><i class="fas fa-tags text-4xl text-[#0F4C81]"></i><p class="font-bold text-lg mt-2">Giá sỉ cạnh tranh</p></div><div><i class="fas fa-certificate text-4xl text-[#0F4C81]"></i><p class="font-bold text-lg mt-2">Chất lượng chuẩn</p></div></div></div>
            <div class="container mx-auto px-4 py-12"><h2 class="text-3xl font-bold border-l-4 border-[#FF8C00] pl-4 mb-8">Danh mục nổi bật</h2><div class="grid grid-cols-2 md:grid-cols-5 gap-5">${['len','hat-nhua','chong-cat','phu-pu','cotton'].map(cat => `<div class="bg-white rounded-xl shadow p-4 text-center cursor-pointer filter-cat hover:shadow-lg transition" data-cat="${cat}"><img src="https://placehold.co/120x120/0F4C81/white?text=${cat}" class="mx-auto w-24 h-24 object-cover rounded-full"><p class="mt-3 font-medium text-lg capitalize">${cat.replace('-',' ')}</p></div>`).join('')}</div></div>
            <div class="container mx-auto px-4 py-8"><div class="flex justify-between items-center"><h2 class="text-3xl font-bold">Sản phẩm bán chạy</h2><a href="#" data-page="products" class="text-[#FF8C00] text-lg">Xem tất cả →</a></div><div class="swiper featuredSwiper mt-8 overflow-hidden"><div class="swiper-wrapper">${featured.map(p => `<div class="swiper-slide"><div class="bg-white p-5 rounded-xl shadow hover:shadow-lg"><img src="${p.image}" class="h-44 mx-auto object-cover"><h3 class="font-bold text-xl mt-2">${p.name}</h3><p class="text-red-600 font-bold text-xl">${formatPrice(p.price)}</p><button class="btn-add-cart-featured bg-[#0F4C81] text-white px-4 py-2 rounded-full mt-3 w-full text-lg" data-id="${p.id}">Mua ngay</button></div></div>`).join('')}</div><div class="swiper-button-next"></div><div class="swiper-button-prev"></div></div></div>
            <footer class="bg-[#0F4C81] text-white py-10 mt-8"><div class="container mx-auto grid md:grid-cols-4 gap-8 px-4"><div><h4 class="font-bold text-xl">Bao Tay Thủy Dương</h4><p class="mt-2">Chuyên cung cấp găng tay bảo hộ lao động</p><p class="mt-2"><i class="fas fa-phone-alt"></i> 033 444 9494</p><p><i class="fab fa-zalo"></i> 0981 171 750</p></div><div><h4 class="font-bold text-lg">Danh mục</h4><ul class="mt-2 space-y-1"><li>Bao tay len</li><li>Găng chống cắt</li><li>Phủ hạt nhựa</li></ul></div><div><h4 class="font-bold text-lg">Chính sách</h4><p>Bảo hành 30 ngày, đổi trả miễn phí</p></div><div><iframe width="100%" height="180" style="border:0" loading="lazy" src="https://maps.google.com/maps?q=Hanoi&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe></div></div><div class="text-center text-sm border-t border-white/20 pt-5 mt-5">© 2025 Bao Tay Thủy Dương - Bảo hộ lao động chuyên nghiệp</div></footer>`;
        }

        function renderProductsPage(){
            return `<div class="container mx-auto px-4 py-10"><div class="flex flex-col md:flex-row gap-8"><div class="md:w-1/4 bg-white p-5 rounded-xl shadow"><h3 class="font-bold text-2xl mb-4">Bộ lọc</h3><select id="categoryFilter" class="w-full border p-3 rounded mb-4 text-base"><option value="all">Tất cả</option><option value="len">Bao tay len</option><option value="hat-nhua">Phủ hạt nhựa</option><option value="chong-cat">Chống cắt</option><option value="phu-pu">Phủ PU</option></select><input type="text" id="searchInputFilter" placeholder="Tìm sản phẩm..." class="w-full border p-3 rounded text-base"></div><div class="md:w-3/4"><div class="grid grid-cols-2 md:grid-cols-3 gap-6" id="productGridContainer"></div></div></div></div>`;
        }

        function renderSimplePage(title, content) {
            return `<div class="container mx-auto px-4 py-20 text-center"><h2 class="text-3xl font-bold text-[#0F4C81]">${title}</h2><p class="text-lg mt-4">${content}</p><div class="mt-6"><a href="#" data-page="home" class="btn-cta text-white px-6 py-3 rounded-lg">Về trang chủ</a></div></div>`;
        }

        function loadPage(page) {
            currentPage = page;
            const main = document.getElementById('appContent');
            if(page === 'home') { main.innerHTML = renderHome(); attachHomeEvents(); initSwiper(); }
            else if(page === 'products') { main.innerHTML = renderProductsPage(); renderProductList('all',''); attachFilterEvents(); }
            else if(page === 'quote') main.innerHTML = renderSimplePage("Báo giá sỉ", "Quý khách vui lòng liên hệ hotline 033 444 9494 hoặc Zalo 0981 171 750 để nhận báo giá tốt nhất.");
            else if(page === 'news') main.innerHTML = renderSimplePage("Tin tức", "Cập nhật các bài viết về bảo hộ lao động sắp ra mắt.");
            else if(page === 'about') main.innerHTML = renderSimplePage("Giới thiệu", "Bao Tay Thủy Dương - 10 năm kinh nghiệm sản xuất găng tay bảo hộ chất lượng cao.");
            else if(page === 'contact') main.innerHTML = renderSimplePage("Liên hệ", "📞 033 444 9494 - 📱 Zalo 0981 171 750 - 📧 baotay@thuydung.com");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function attachFilterEvents(){
            const catFilter = document.getElementById('categoryFilter');
            const searchFilter = document.getElementById('searchInputFilter');
            function refresh(){ renderProductList(catFilter?.value || 'all', searchFilter?.value || ''); }
            if(catFilter) catFilter.addEventListener('change', refresh);
            if(searchFilter) searchFilter.addEventListener('input', refresh);
            refresh();
        }
        function attachHomeEvents(){
            document.querySelectorAll('.filter-cat').forEach(el => el.addEventListener('click', (e) => { let cat = el.dataset.cat; loadPage('products'); setTimeout(()=>{ let filter = document.getElementById('categoryFilter'); if(filter) filter.value=cat; renderProductList(cat,''); }, 50); }));
            document.querySelectorAll('.btn-add-cart-featured').forEach(btn => btn.addEventListener('click', (e)=>{ addToCart(parseInt(btn.dataset.id),1); }));
            const quoteBtn = document.getElementById('getQuoteBtn');
            if(quoteBtn) quoteBtn.onclick = () => { showToast("Liên hệ báo giá sỉ: 033 444 9494 hoặc Zalo 0981 171 750"); };
        }
        function initSwiper(){
            if(document.querySelector('.featuredSwiper')) new Swiper('.featuredSwiper', { slidesPerView: 2, spaceBetween: 20, navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' }, breakpoints: { 768: { slidesPerView: 3 }, 1024: { slidesPerView: 4 } } });
        }

        // Sự kiện DOM
        document.getElementById('cartIconHeader')?.addEventListener('click', () => document.getElementById('cartDrawer')?.classList.remove('translate-x-full'));
        document.getElementById('closeCartBtn')?.addEventListener('click', () => document.getElementById('cartDrawer')?.classList.add('translate-x-full'));
        document.getElementById('checkoutBtn')?.addEventListener('click', () => { document.getElementById('checkoutModal').style.display = 'flex'; });
        document.getElementById('closeCheckout')?.addEventListener('click', () => document.getElementById('checkoutModal').style.display = 'none');
        document.getElementById('checkoutForm')?.addEventListener('submit', (e) => { e.preventDefault(); alert("✅ Đặt hàng thành công! Chúng tôi sẽ liên hệ xác nhận trong ít phút."); cart = []; saveCart(); document.getElementById('checkoutModal').style.display = 'none'; document.getElementById('cartDrawer')?.classList.add('translate-x-full'); });
        document.querySelectorAll('.nav-link').forEach(link => link.addEventListener('click', (e) => { e.preventDefault(); let page = link.dataset.page; if(page) loadPage(page); }));
        setTimeout(() => { document.getElementById('discountPopup')?.classList.remove('hidden'); }, 5000);
        document.getElementById('closePopup')?.onclick = () => document.getElementById('discountPopup')?.classList.add('hidden');
        document.getElementById('popupCta')?.onclick = () => { document.getElementById('discountPopup')?.classList.add('hidden'); showToast("Mã THUYDUNG10: giảm 10% đơn hàng đầu"); };
        window.addEventListener('load', () => { loadPage('home'); updateCartUI(); });
    </script>
</body>
</html>
