                                <li><i class="fas fa-angle-right mr-1.5 text-[#FF8C00]"></i> Mang đến giải pháp sản xuất tự động hóa hiệu quả cao cho đối tác.</li>
                                <li><i class="fas fa-angle-right mr-1.5 text-[#FF8C00]"></i> Cung cấp sản phẩm an toàn chất lượng với giá gốc xưởng tốt nhất.</li>
                                <li><i class="fas fa-angle-right mr-1.5 text-[#FF8C00]"></i> Đồng hành, góp phần nâng cao ý thức bảo hộ lao động toàn quốc.</li>
                            </ul>
                        </div>
                    </div>

                    <!-- CAM KẾT & THÔNG ĐIỆP -->
                    <div class="mt-12 bg-gradient-to-r from-[#0F4C81] to-[#1565C0] text-white p-8 rounded-2xl text-center shadow-md">
                        <h4 class="font-bold text-xl uppercase tracking-wide mb-6">CAM KẾT CỦA XUÂN CHƯƠNG GLOVES</h4>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-4 text-sm font-medium mb-6">
                            <div class="flex items-center justify-center gap-2"><i class="fas fa-check-circle text-[#FF8C00]"></i> Sản phẩm chất lượng cao</div>
                            <div class="flex items-center justify-center gap-2"><i class="fas fa-check-circle text-[#FF8C00]"></i> Giá thành tốt tận gốc</div>
                            <div class="flex items-center justify-center gap-2"><i class="fas fa-check-circle text-[#FF8C00]"></i> Nguồn hàng ổn định sỉ</div>
                            <div class="flex items-center justify-center gap-2"><i class="fas fa-check-circle text-[#FF8C00]"></i> Kỹ thuật hỗ trợ 24/7</div>
                            <div class="flex items-center justify-center gap-2"><i class="fas fa-check-circle text-[#FF8C00]"></i> Giao hàng toàn quốc nhanh</div>
                            <div class="flex items-center justify-center gap-2"><i class="fas fa-check-circle text-[#FF8C00]"></i> Hậu mãi đại lý chu đáo</div>
                        </div>
                        <p class="italic text-[#FF8C00] font-bold text-base md:text-lg border-t border-blue-400 pt-4 mt-2">"Xuân Chương Gloves – Kết nối công nghệ, nâng tầm chất lượng, đồng hành cùng phát triển."</p>
                    </div>
                </div>
            </section>

            <!-- LIÊN HỆ CHI TIẾT -->
            <section class="py-16 bg-slate-900 text-gray-300">
                <div class="container mx-auto px-4 max-w-5xl">
                    <div class="text-center mb-10">
                        <h2 class="text-2xl md:text-3xl font-bold text-white uppercase">THÔNG TIN LIÊN HỆ CHÍNH THỨC</h2>
                        <div class="h-0.5 w-16 bg-[#FF8C00] mx-auto mt-2"></div>
                    </div>
                    <div class="grid md:grid-cols-12 gap-8 items-start">
                        <div class="md:col-span-6 space-y-4 text-sm md:text-base">
                            <h3 class="text-lg font-bold text-white mb-2 uppercase tracking-wide">CÔNG TY TNHH XUÂN CHƯƠNG GLOVES</h3>
                            <p class="flex items-start gap-3"><i class="fas fa-map-marker-alt text-[#FF8C00] mt-1 flex-shrink-0"></i> <span><strong>Địa chỉ:</strong> Số 68, tổ 4, Khu phố 4, Phường Trảng Dài, Thành phố Biên Hòa, Tỉnh Đồng Nai, Việt Nam</span></p>
                            <p class="flex items-center gap-3"><i class="fas fa-phone-alt text-[#FF8C00] flex-shrink-0"></i> <span><strong>Hotline tư vấn sỉ:</strong> 033 444 9494</span></p>
                            <p class="flex items-center gap-3"><i class="fab fa-zalo text-[#FF8C00] flex-shrink-0"></i> <span><strong>Zalo nhà máy:</strong> 0981 171 750</span></p>
                            <p class="flex items-center gap-3"><i class="fas fa-envelope text-[#FF8C00] flex-shrink-0"></i> <span><strong>Email:</strong> baotay@thuydung.com</span></p>
                            <p class="flex items-center gap-3"><i class="fas fa-globe text-[#FF8C00] flex-shrink-0"></i> <span><strong>Website:</strong> https://baotaythuyduong.github.io/BaoTayThuyDuong/</span></p>
                        </div>
                        <div class="md:col-span-6">
                            <iframe width="100%" height="220" style="border:0" class="rounded-xl shadow-lg opacity-80" loading="lazy" src="https://maps.google.com/maps?q=Số+68+tổ+4+Khu+phố+4+Trảng+Dài+Biên+Hòa+Đồng+Nai&t=&z=16&ie=UTF8&iwloc=&output=embed"></iframe><a href="https://www.google.com/maps/search/?api=1&query=Số+68+tổ+4+Khu+phố+4+Trảng+Dài+Biên+Hòa+Đồng+Nai" target="_blank" class="block text-center bg-[#FF8C00] text-white text-sm font-bold py-2 mt-2 rounded-xl shadow-md"><i class="fas fa-navigation mr-1"></i>Bấm để bật định vị dẫn đường</a>
                        </div>
                    </div>
                </div>
            </section>
            `;
        }

        function renderProductsPage() {
            return `<div class="container mx-auto px-4 py-10"><div class="flex flex-col md:flex-row gap-8"><div class="md:w-1/4 bg-white p-5 rounded-xl shadow h-fit"><h3 class="font-bold text-2xl mb-4">Bộ lọc</h3><label class="block text-sm font-medium text-gray-700 mb-1">Danh mục</label><select id="categoryFilter" class="w-full border p-3 rounded-lg mb-4 text-sm focus:outline-none focus:border-[#0F4C81]"><option value="all">Tất cả sản phẩm</option><option value="len">Bao tay len</option><option value="poly">Bao tay Poly</option><option value="chong-cat-giat">Chống cắt / chống giật</option><option value="phu-son">Phủ sơn / PU / Nitrile</option></select><label class="block text-sm font-medium text-gray-700 mb-1">Từ khóa</label><input type="text" id="searchInputFilter" placeholder="Tìm sản phẩm..." class="w-full border p-3 rounded-lg text-sm focus:outline-none focus:border-[#0F4C81]"></div><div class="md:w-3/4"><div class="grid grid-cols-2 md:grid-cols-3 gap-6" id="productGridContainer"></div></div></div></div>`;
        }

        function renderProductList(filterCategory = "all", searchQuery = "") {
            let filtered = products.filter(p => (filterCategory === "all" || p.category === filterCategory) && p.name.toLowerCase().includes(searchQuery.toLowerCase()));
            const container = document.getElementById('productGridContainer');
            if(!container) return;
            if(filtered.length === 0) { container.innerHTML = '<div class="col-span-full text-center py-12 text-gray-500 text-lg">Không tìm thấy sản phẩm phù hợp</div>'; return; }
            container.innerHTML = filtered.map(p => `
                <div class="product-card bg-white rounded-xl shadow-md p-4 flex flex-col justify-between h-80" data-id="${p.id}">
                    <div>
                        <img src="${p.image}" class="card-main-img w-full h-44 object-cover rounded-lg mb-3">
                        <h3 class="font-bold text-sm line-clamp-2 min-h-[2.5rem] text-gray-800 leading-tight">${p.name}</h3>
                        <p class="text-red-600 font-bold text-xs mt-1">${displayPrice(p.price)}</p>
                    </div>
                    <div class="flex flex-col gap-2 mt-3">
                        <button class="view-detail-btn bg-[#0F4C81] text-white px-3 py-2 rounded-full text-xs hover:bg-opacity-90 w-full">
                            <i class="fas fa-layer-group mr-1"></i> Xem chi tiết & Tùy chọn
                        </button>
                    </div>
                </div>`).join('');
            attachProductEvents();
        }

        function attachProductEvents() {
            document.querySelectorAll('.product-card').forEach(card => {
                card.querySelector('.view-detail-btn').addEventListener('click', () => showProductDetail(parseInt(card.dataset.id)));
            });
        }

        function attachFilterEvents() {
            const catFilter = document.getElementById('categoryFilter');
            const searchFilter = document.getElementById('searchInputFilter');
            const refresh = () => renderProductList(catFilter?.value || 'all', searchFilter?.value || '');
            if(catFilter) catFilter.addEventListener('change', refresh);
            if(searchFilter) searchFilter.addEventListener('input', refresh);
            refresh();
        }

        function attachHomeEvents() {
            document.querySelectorAll('.filter-cat').forEach(el => el.addEventListener('click', () => {
                let cat = el.dataset.cat;
                loadPage('products');
                setTimeout(() => { const c = document.getElementById('categoryFilter'); if(c) { c.value = cat; renderProductList(cat, ''); } }, 50);
            }));
            document.querySelectorAll('.view-detail-btn').forEach(btn => btn.addEventListener('click', () => showProductDetail(parseInt(btn.dataset.id))));
            document.getElementById('getQuoteBtn')?.addEventListener('click', () => showToast("Liên hệ báo giá sỉ: 033 444 9494 hoặc Zalo 0981 171 750"));
        }

        function initSwiper() {
            if(document.querySelector('.featuredSwiper')) {
                new Swiper('.featuredSwiper', { slidesPerView: 2, spaceBetween: 16, navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' }, breakpoints: { 768: { slidesPerView: 3 }, 1024: { slidesPerView: 4 } } });
            }
        }

        function initHeaderSearch() {
            const searchInput = document.getElementById('headerSearch');
            const searchBtn = document.getElementById('headerSearchBtn');
            const triggerSearch = () => {
                let query = searchInput.value.trim();
                loadPage('products');
                setTimeout(() => { const s = document.getElementById('searchInputFilter'); if(s) { s.value = query; renderProductList('all', query); } }, 50);
            };
            searchBtn?.addEventListener('click', triggerSearch);
            searchInput?.addEventListener('keypress', (e) => { if(e.key === 'Enter') triggerSearch(); });
        }

        function attachMegaMenuEvents() {
            document.querySelectorAll('.click-mega-header').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    let cat = btn.dataset.cat;
                    loadPage('products');
                    setTimeout(() => { const c = document.getElementById('categoryFilter'); if(c) { c.value = cat; renderProductList(cat, ''); } }, 50);
                });
            });
        }

        function renderSimplePage(title, content) {
            return `<div class="container mx-auto px-4 py-20 text-center"><h2 class="text-3xl font-bold text-[#0F4C81]">${title}</h2><p class="text-lg mt-4 text-gray-600">${content}</p><div class="mt-6"><a href="#" data-page="home" class="nav-link btn-cta text-white px-6 py-3 rounded-lg inline-block">Về trang chủ</a></div></div>`;
        }

        function loadPage(page) {
            currentPage = page;
            const main = document.getElementById('appContent');
            if(!main) return;
            if(page === 'home') { main.innerHTML = renderHome(); attachHomeEvents(); initSwiper(); }
            else if(page === 'about') { main.innerHTML = renderAbout(); }
            else if(page === 'products') { main.innerHTML = renderProductsPage(); renderProductList('all', ''); attachFilterEvents(); }
            else if(page === 'news') main.innerHTML = renderSimplePage("Tin tức", "Cập nhật các bài viết về bảo hộ lao động sắp ra mắt.");
            else if(page === 'contact') main.innerHTML = renderSimplePage("Liên hệ", "📞 033 444 9494 - 📱 Zalo 0981 171 750 - 📧 baotay@thuydung.com");
            bindMenuEvents();
            window.scrollTo({ top: 0 });
        }

        function bindMenuEvents() {
            document.querySelectorAll('.nav-link').forEach(link => {
                link.removeEventListener('click', handleNavClick);
                link.addEventListener('click', handleNavClick);
            });
        }

        function handleNavClick(e) {
            e.preventDefault();
            const page = e.currentTarget.getAttribute('data-page');
            if(page) loadPage(page);
        }

        document.getElementById('cartIconHeader')?.addEventListener('click', () => document.getElementById('cartDrawer')?.classList.remove('translate-x-full'));
        document.getElementById('closeCartBtn')?.addEventListener('click', () => document.getElementById('cartDrawer')?.classList.add('translate-x-full'));
        document.getElementById('checkoutBtn')?.addEventListener('click', () => {
            if(cart.length === 0) { showToast("Vui lòng thêm sản phẩm cần báo giá vào danh sách!"); return; }
            document.getElementById('checkoutModal').style.display = 'flex';
        });
        document.getElementById('closeCheckout')?.addEventListener('click', () => document.getElementById('checkoutModal').style.display = 'none');
        document.getElementById('checkoutForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            alert("✅ Gửi yêu cầu thành công! Chúng tôi sẽ tổng hợp danh sách mặt hàng và liên hệ báo giá sỉ sớm nhất.");
            cart = []; saveCart();
            document.getElementById('checkoutModal').style.display = 'none';
            document.getElementById('cartDrawer')?.classList.add('translate-x-full');
            loadPage('products');
        });

        window.addEventListener('DOMContentLoaded', () => {
            loadPage('home');
            updateCartUI();
            initHeaderSearch();
            attachMegaMenuEvents();
        });
    </script>
</body>
</html>
