                    </div>
                </div>

            <section class="py-16 bg-gray-50">
                <div class="container mx-auto px-4">
                    <h2 class="text-3xl font-bold text-center text-[#0F4C81] mb-10">Danh mục sản phẩm</h2>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                        <div class="bg-white p-5 rounded-xl shadow text-center hover:shadow-lg transition cursor-pointer filter-cat" data-cat="len"><img src="https://placehold.co/150x150/0F4C81/white?text=Len" class="mx-auto w-28 h-28 object-cover rounded-full"><h3 class="font-bold mt-3">Bao tay len</h3><p class="text-sm text-gray-500">Nhiều chủng loại dệt sỉ</p></div>
                        <div class="bg-white p-5 rounded-xl shadow text-center hover:shadow-lg transition cursor-pointer filter-cat" data-cat="poly"><img src="https://placehold.co/150x150/FF8C00/white?text=Poly" class="mx-auto w-28 h-28 object-cover rounded-full"><h3 class="font-bold mt-3">Bao tay Poly</h3><p class="text-sm text-gray-500">Sợi vải mềm nhẹ chống bụi</p></div>
                        <div class="bg-white p-5 rounded-xl shadow text-center hover:shadow-lg transition cursor-pointer filter-cat" data-cat="chong-cat-giat"><img src="https://placehold.co/150x150/d32f2f/white?text=Chong+Cat+Giat" class="mx-auto w-28 h-28 object-cover rounded-full"><h3 class="font-bold mt-3">Chống cắt / chống giật</h3><p class="text-sm text-gray-500">Kháng cơ học, cách điện an toàn</p></div>
                        <div class="bg-white p-5 rounded-xl shadow text-center hover:shadow-lg transition cursor-pointer filter-cat" data-cat="phu-son"><img src="https://placehold.co/150x150/2e7d32/white?text=Phu+Son+PU" class="mx-auto w-28 h-28 object-cover rounded-full"><h3 class="font-bold mt-3">Phủ sơn / PU / Nitrile</h3><p class="text-sm text-gray-500">Chống trơn trượt dầu mỡ tốt</p></div>
                    </div>

            </section>
            <section class="py-16 bg-white">
                <div class="container mx-auto px-4">
                    <div class="flex justify-between items-center mb-8"><h2 class="text-3xl font-bold text-[#0F4C81]">Sản phẩm nổi bật</h2><a href="#" data-page="products" class="nav-link text-[#FF8C00] text-lg">Xem tất cả →</a></div>
                    <div class="swiper featuredSwiper overflow-hidden"><div class="swiper-wrapper">${featured.map(p => `<div class="swiper-slide"><div class="bg-gray-50 p-5 rounded-xl shadow text-center flex flex-col justify-between h-80"><img src="${p.image}" class="h-36 mx-auto object-cover rounded-lg"><h3 class="font-bold text-sm mt-3 line-clamp-1 text-gray-800">${p.name}</h3><p class="text-red-600 font-bold text-xs mt-1">${displayPrice(p.price)}</p><button class="view-detail-btn bg-[#0F4C81] text-white px-4 py-2 rounded-full mt-3 w-full text-xs hover:bg-opacity-90" data-id="${p.id}">Chi tiết / Báo giá</button></div></div>`).join('')}</div><div class="swiper-button-next"></div><div class="swiper-button-prev"></div></div>
                </div>
            </section>

                        <iframe width="100%" height="450" src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=0" title="Nhà máy" frameborder="0" allowfullscreen class="rounded-2xl shadow-2xl"></iframe>
                    </div>
                </div>
            </section>
            <footer class="bg-gray-800 text-gray-300 py-10">
                <div class="container mx-auto px-4 grid md:grid-cols-4 gap-8">
                    <div><h4 class="text-xl font-bold text-white mb-3">Bao Tay Thùy Dương</h4><p class="text-sm">Chuyên cung cấp găng tay bảo hộ lao động</p><p class="mt-2 text-sm"><i class="fas fa-phone-alt"></i> 033 444 9494</p><p class="text-sm"><i class="fab fa-zalo"></i> 0981 171 750</p></div>
                    <div><h4 class="text-lg font-bold text-white mb-3">Danh mục</h4><ul class="space-y-1 text-sm"><li>Bao tay len</li><li>Bao tay Poly</li><li>Chống cắt / chống giật</li><li>Phủ sơn / PU</li></ul></div>
                    <div><h4 class="text-lg font-bold text-white mb-3">Hỗ trợ</h4><div class="space-y-1 text-sm"><p>Chính sách bảo hành</p><p>Hướng dẫn đặt hàng</p></div></div>
                    <div><iframe width="100%" height="150" style="border:0" loading="lazy" src="https://maps.google.com/maps?q=Biên+Hòa+Đồng+Nai&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe></div>
                </div>
                <div class="text-center text-sm border-t border-gray-700 pt-5 mt-5">© 2026 Bao Tay Thùy Dương - Bảo hộ lao động chuyên nghiệp</div>
            </footer>`;
        }

        // ---------- TRANG GIỚI THIỆU (ABOUT) ----------
        function renderAbout() {
            return `<div class="about-banner bg-[#0F4C81] flex items-center justify-center" style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://placehold.co/1600x700/0F4C81/white?text=GIỚI+THIỆU+CÔNG+TY'); background-size: cover;"><div class="text-center text-white"><h1 class="text-5xl md:text-7xl font-bold">GIỚI THIỆU</h1><p class="text-xl md:text-2xl mt-3">Công ty TNHH Xuân Chương Gloves</p></div></div>
            <section class="py-16 bg-white"><div class="container mx-auto px-4 max-w-5xl"><div class="flex flex-col md:flex-row gap-10 items-center"><div><h2 class="text-3xl font-bold text-[#0F4C81]">Công ty TNHH Xuân Chương Gloves</h2><p class="mt-4 text-gray-700 text-lg">Được thành lập năm 2018, chúng tôi tự hào là đơn vị sản xuất và phân phối bao tay bảo hộ lao động hàng đầu khu vực phía Nam. Với dây chuyền hiện đại sản xuất số lượng lớn, chúng tôi cam kết đáp ứng mọi nhu cầu sỉ trên toàn quốc.</p></div></div></div></section>`;
        }

        // ---------- TRANG SẢN PHẨM ----------
        function renderProductsPage(){
            return `<div class="container mx-auto px-4 py-10">
                        <div class="flex flex-col md:flex-row gap-8">
                            <div class="md:w-1/4 bg-white p-5 rounded-xl shadow h-fit">
                                <h3 class="font-bold text-2xl mb-4">Bộ lọc</h3>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Danh mục</label>
                                <select id="categoryFilter" class="w-full border p-3 rounded-lg mb-4 text-sm focus:outline-none focus:border-[#0F4C81]">
                                    <option value="all">Tất cả sản phẩm</option>
                                    <option value="len">Bao tay len</option>
                                    <option value="poly">Bao tay Poly</option>
                                    <option value="chong-cat-giat">Chống cắt / chống giật</option>
                                    <option value="phu-son">Phủ sơn / PU / Nitrile</option>
                                </select>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Từ khóa</label>
                                <input type="text" id="searchInputFilter" placeholder="Tìm sản phẩm..." class="w-full border p-3 rounded-lg text-sm focus:outline-none focus:border-[#0F4C81]">
                            </div>
                            <div class="md:w-3/4">
                                <div class="grid grid-cols-2 md:grid-cols-3 gap-6" id="productGridContainer"></div>
                            </div>
                        </div>
                    </div>`;
        }
        
        function renderProductList(filterCategory = "all", searchQuery = "") {
            let filtered = products.filter(p => (filterCategory === "all" || p.category === filterCategory) && p.name.toLowerCase().includes(searchQuery.toLowerCase()));
            const container = document.getElementById('productGridContainer');
            if(!container) return;
            if(filtered.length === 0) { 
                container.innerHTML = '<div class="col-span-full text-center py-12 text-gray-500 text-lg">Không tìm thấy sản phẩm phù hợp</div>'; 
                return;
            }
            container.innerHTML = filtered.map(p => `
                <div class="product-card bg-white rounded-xl shadow-md p-4 flex flex-col justify-between h-80" data-id="${p.id}">
                    <div>
                        <img src="${p.image}" class="card-main-img w-full h-44 object-cover rounded-lg mb-3">
                        <h3 class="font-bold text-sm line-clamp-2 min-h-[2.5rem] text-gray-800 leading-tight">${p.name}</h3>
                        <p class="text-red-600 font-bold text-xs mt-1">${displayPrice(p.price)}</p>
                    </div>
                    <div class="flex flex-col gap-2 mt-3">
                        <button class="view-detail-btn bg-[#0F4C81] text-white px-3 py-2 rounded-full text-xs hover:bg-opacity-90 w-full">
                            <i class="fas fa-layer-group mr-1"></i> Xem chi tiết & Tùy chọn
                        </button>
                    </div>
                </div>`).join('');
            attachProductEvents();
        }

        function attachProductEvents(){
            document.querySelectorAll('.product-card').forEach(card => {
                let id = parseInt(card.dataset.id);
                card.querySelector('.view-detail-btn').addEventListener('click', () => showProductDetail(id));
            });
        }

        function attachFilterEvents(){
            const catFilter = document.getElementById('categoryFilter');
            const searchFilter = document.getElementById('searchInputFilter');
            const refresh = () => renderProductList(catFilter?.value || 'all', searchFilter?.value || '');
            if(catFilter) catFilter.addEventListener('change', refresh);
            if(searchFilter) searchFilter.addEventListener('input', refresh);
            refresh();
        }

        function attachHomeEvents() {
            document.querySelectorAll('.filter-cat').forEach(el => el.addEventListener('click', () => { 
                let cat = el.dataset.cat; 
                loadPage('products'); 
                setTimeout(()=>{ 
                    const catFilter = document.getElementById('categoryFilter');
                    if(catFilter) { catFilter.value = cat; renderProductList(cat, ''); }
                }, 50); 
            }));
            document.querySelectorAll('.view-detail-btn').forEach(btn => btn.addEventListener('click', ()=>{ 
                showProductDetail(parseInt(btn.dataset.id)); 
            }));
            document.getElementById('getQuoteBtn')?.addEventListener('click', () => showToast("Liên hệ báo giá sỉ: 033 444 9494 hoặc Zalo 0981 171 750"));
        }

        function initSwiper(){
            if(document.querySelector('.featuredSwiper')) {
                new Swiper('.featuredSwiper', { 
                    slidesPerView: 2, 
                    spaceBetween: 16, 
                    navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' }, 
                    breakpoints: { 768: { slidesPerView: 3 }, 1024: { slidesPerView: 4 } } 
                });
            }
        }

        function initHeaderSearch() {
            const searchInput = document.getElementById('headerSearch');
            const searchBtn = document.getElementById('headerSearchBtn');
            const triggerSearch = () => {
                let query = searchInput.value.trim();
                loadPage('products');
                setTimeout(() => {
                    const searchFilter = document.getElementById('searchInputFilter');
                    if(searchFilter) { searchFilter.value = query; renderProductList('all', query); }
                }, 50);
            };
            searchBtn?.addEventListener('click', triggerSearch);
            searchInput?.addEventListener('keypress', (e) => { if(e.key === 'Enter') triggerSearch(); });
        }

        function attachMegaMenuEvents() {
            document.querySelectorAll('.click-mega-header').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    let cat = btn.dataset.cat;
                    loadPage('products');
                    setTimeout(() => {
                        const catFilter = document.getElementById('categoryFilter');
                        if(catFilter) { catFilter.value = cat; renderProductList(cat, ''); }
                    }, 50);
                });
            });
        }

        function renderSimplePage(title, content) {
            return `<div class="container mx-auto px-4 py-20 text-center"><h2 class="text-3xl font-bold text-[#0F4C81]">${title}</h2><p class="text-lg mt-4 text-gray-600">${content}</p><div class="mt-6"><a href="#" data-page="home" class="nav-link btn-cta text-white px-6 py-3 rounded-lg inline-block">Về trang chủ</a></div></div>`;
        }

        function loadPage(page) {
            currentPage = page;
            const main = document.getElementById('appContent');
            if(!main) return;
            
            if(page === 'home') { main.innerHTML = renderHome(); attachHomeEvents(); initSwiper(); }
            else if(page === 'about') { main.innerHTML = renderAbout(); }
            else if(page === 'products') { main.innerHTML = renderProductsPage(); renderProductList('all',''); attachFilterEvents(); }
            else if(page === 'news') main.innerHTML = renderSimplePage("Tin tức", "Cập nhật các bài viết về bảo hộ lao động sắp ra mắt.");
            else if(page === 'contact') main.innerHTML = renderSimplePage("Liên hệ", "📞 033 444 9494 - 📱 Zalo 0981 171 750 - 📧 baotay@thuydung.com");
            
            bindMenuEvents();
            window.scrollTo({ top: 0 });
        }

        function bindMenuEvents() {
            document.querySelectorAll('.nav-link').forEach(link => {
                link.removeEventListener('click', handleNavClick);
                link.addEventListener('click', handleNavClick);
            });
        }
        
        function handleNavClick(e) {
            e.preventDefault();
            const page = e.currentTarget.getAttribute('data-page');
            if(page) loadPage(page);
        }

        document.getElementById('cartIconHeader')?.addEventListener('click', () => document.getElementById('cartDrawer')?.classList.remove('translate-x-full'));
        document.getElementById('closeCartBtn')?.addEventListener('click', () => document.getElementById('cartDrawer')?.classList.add('translate-x-full'));
        document.getElementById('checkoutBtn')?.addEventListener('click', () => {
            if(cart.length === 0) { showToast("Vui lòng thêm sản phẩm cần báo giá vào danh sách!"); return; }
            document.getElementById('checkoutModal').style.display = 'flex';
        });
        document.getElementById('closeCheckout')?.addEventListener('click', () => document.getElementById('checkoutModal').style.display = 'none');
        document.getElementById('checkoutForm')?.addEventListener('submit', (e) => { 
            e.preventDefault(); 
            alert("✅ Gửi yêu cầu thành công! Chúng tôi sẽ tổng hợp danh sách mặt hàng và liên hệ báo giá sỉ sớm nhất."); 
            cart = []; saveCart(); 
            document.getElementById('checkoutModal').style.display = 'none'; 
            document.getElementById('cartDrawer')?.classList.add('translate-x-full'); 
            loadPage('products');
        });

        window.addEventListener('DOMContentLoaded', () => { 
            loadPage('home'); 
            updateCartUI(); 
            initHeaderSearch();
            attachMegaMenuEvents();
        });
    </script>
</body>
