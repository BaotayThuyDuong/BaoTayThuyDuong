    <script>
        // DANH SÁCH SẢN PHẨM MẪU
        const products = [
            { id: 1, name: "Bao tay len 40g - Cao cấp", price: 8500, category: "len", stock: 1500, image: "https://placehold.co/400x400/0F4C81/white?text=Len+40g", rating: 4.8, featured: true },
            { id: 2, name: "Bao tay phủ hạt nhựa", price: 15900, category: "hat-nhua", stock: 890, image: "https://placehold.co/400x400/FF8C00/white?text=Phủ+Hạt+Nhựa", rating: 4.9, featured: true },
            { id: 3, name: "Găng tay chống cắt cấp 5", price: 45000, category: "chong-cat", stock: 340, image: "https://placehold.co/400x400/d32f2f/white?text=Chống+Cắt", rating: 5.0, featured: true },
            { id: 4, name: "Bao tay phủ PU mỏng", price: 18900, category: "phu-pu", stock: 2100, image: "https://placehold.co/400x400/2e7d32/white?text=Phủ+PU", rating: 4.7 },
            { id: 5, name: "Bao tay cotton tráng nhựa", price: 6900, category: "cotton", stock: 3000, image: "https://placehold.co/400x400/795548/white?text=Cotton", rating: 4.5, featured: true },
            { id: 6, name: "Bao tay len chống trơn", price: 12500, category: "len", stock: 950, image: "https://placehold.co/400x400/1565C0/white?text=Chống+Trơn", rating: 4.8, featured: true }
        ];
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let currentPage = 'home';

        function formatPrice(price) { return price.toLocaleString('vi-VN') + '₫'; }
        function saveCart() { localStorage.setItem('cart', JSON.stringify(cart)); updateCartUI(); }
        function updateCartUI() { 
            let count = cart.reduce((s, i) => s + i.quantity, 0);
            document.getElementById('cartCountHeader').innerText = count;
            renderCartItems();
        }
        function renderCartItems() {
            const container = document.getElementById('cartItemsList');
            if(!container) return;
            if(cart.length === 0) { container.innerHTML = '<div class="text-center text-gray-500 py-8 text-lg">Giỏ hàng trống</div>'; document.getElementById('cartTotal').innerText = '0₫'; return; }
            let total = 0;
            let html = '';
            cart.forEach((item) => {
                const prod = products.find(p => p.id === item.id);
                if(!prod) return;
                const itemTotal = prod.price * item.quantity;
                total += itemTotal;
                html += `<div class="flex gap-3 border-b pb-3">
                            <img src="${prod.image}" class="w-16 h-16 object-cover rounded">
                            <div class="flex-1"><p class="font-semibold text-base">${prod.name}</p><p class="text-sm">${formatPrice(prod.price)}</p>
                            <div class="flex items-center gap-2 mt-1"><button class="cart-qty-minus bg-gray-200 px-2 rounded" data-id="${prod.id}">-</button><span class="mx-1">${item.quantity}</span><button class="cart-qty-plus bg-gray-200 px-2 rounded" data-id="${prod.id}">+</button><button class="text-red-500 text-sm ml-2 remove-item" data-id="${prod.id}"><i class="fas fa-trash-alt"></i></button></div></div>
                            <div class="font-bold">${formatPrice(itemTotal)}</div>
                        </div>`;
            });
            container.innerHTML = html;
            document.getElementById('cartTotal').innerText = formatPrice(total);
            document.querySelectorAll('.cart-qty-minus').forEach(btn => btn.addEventListener('click', (e) => { let id = parseInt(btn.dataset.id); adjustQuantity(id, -1); }));
            document.querySelectorAll('.cart-qty-plus').forEach(btn => btn.addEventListener('click', (e) => { let id = parseInt(btn.dataset.id); adjustQuantity(id, 1); }));
            document.querySelectorAll('.remove-item').forEach(btn => btn.addEventListener('click', (e) => { let id = parseInt(btn.dataset.id); cart = cart.filter(i => i.id !== id); saveCart(); }));
        }
        function adjustQuantity(id, delta) { let idx = cart.findIndex(i => i.id === id); if(idx !== -1) { cart[idx].quantity += delta; if(cart[idx].quantity <= 0) cart.splice(idx,1); saveCart(); } }
        function addToCart(id, qty=1) { let existing = cart.find(i => i.id === id); if(existing) existing.quantity += qty; else cart.push({ id, quantity: qty }); saveCart(); showToast("✅ Đã thêm vào giỏ!"); }
        function showToast(msg) { let toast = document.createElement('div'); toast.className = "fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-5 py-2 rounded-lg z-[1200] text-base"; toast.innerText = msg; document.body.appendChild(toast); setTimeout(()=>toast.remove(),2000); }

        // ---------- TRANG CHỦ (HOME) với cấu trúc mới ----------
        function renderHome() {
            const featured = products.filter(p => p.featured);
            return `
            <!-- Hero full màn hình -->
            <section class="hero-full bg-gradient-to-r from-[#0F4C81] to-[#0b3a62] text-white flex items-center">
                <div class="container mx-auto px-4 py-12 md:py-0">
                    <div class="flex flex-col md:flex-row items-center gap-12">
                        <div class="md:w-1/2 text-center md:text-left">
                            <h1 class="text-4xl md:text-6xl font-bold leading-tight">BAO TAY LEN BẢO HỘ LAO ĐỘNG</h1>
                            <p class="text-2xl text-[#FF8C00] font-semibold mt-3">Chất lượng cao – Giá tận xưởng – Giao hàng toàn quốc</p>
                            <div class="mt-8 flex flex-wrap gap-4 justify-center md:justify-start">
                                <a href="#" data-page="products" class="btn-cta text-white px-8 py-3 rounded-lg font-bold text-lg">Xem sản phẩm</a>
                                <button id="getQuoteBtn" class="border-2 border-white px-8 py-3 rounded-lg font-bold text-lg hover:bg-white hover:text-[#0F4C81] transition">Liên hệ báo giá</button>
                            </div>
                        </div>
                        <div class="md:w-1/2">
                            <img src="https://placehold.co/600x500/FFFFFF/0F4C81?text=Găng+tay+Thùy+Dương" alt="Banner" class="rounded-2xl shadow-2xl">
                        </div>
                    </div>
                </div>
            </section>

            <!-- Giới thiệu ngắn công ty -->
            <section class="py-16 bg-white">
                <div class="container mx-auto px-4">
                    <div class="flex flex-col md:flex-row items-center gap-10">
                        <div class="md:w-1/2">
                            <img src="https://placehold.co/500x400/0F4C81/white?text=Nhà+máy+Thùy+Dương" alt="Công ty" class="rounded-2xl shadow-lg w-full">
                        </div>
                        <div class="md:w-1/2">
                            <h2 class="text-3xl font-bold text-[#0F4C81]">CÔNG TY TNHH XUÂN CHƯƠNG GLOVES</h2>
                            <p class="mt-4 text-gray-700 text-lg">Chuyên sản xuất và phân phối bao tay len bảo hộ lao động phục vụ công trình, nhà máy và đại lý trên toàn quốc.</p>
                            <p class="mt-3 text-gray-600"><i class="fas fa-map-marker-alt text-[#FF8C00] mr-2"></i> Số 68, tổ 4, Khu phố 4, Phường Trảng Dài, TP. Biên Hòa, Đồng Nai</p>
                            <div class="mt-6">
                                <a href="#" data-page="about" class="inline-block bg-[#0F4C81] text-white px-6 py-2 rounded-lg hover:bg-[#0a3a62]">Xem chi tiết →</a>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Danh mục sản phẩm (grid 4 cột) -->
            <section class="py-16 bg-gray-50">
                <div class="container mx-auto px-4">
                    <h2 class="text-3xl font-bold text-center text-[#0F4C81] mb-10">Danh mục sản phẩm</h2>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                        <div class="bg-white p-5 rounded-xl shadow text-center hover:shadow-lg transition cursor-pointer filter-cat" data-cat="len"><img src="https://placehold.co/150x150/0F4C81/white?text=Len" class="mx-auto w-28 h-28 object-cover rounded-full"><h3 class="font-bold mt-3">Bao tay len</h3><p class="text-sm text-gray-500">Chống trơn, bền</p></div>
                        <div class="bg-white p-5 rounded-xl shadow text-center hover:shadow-lg transition cursor-pointer filter-cat" data-cat="phu-pu"><img src="https://placehold.co/150x150/FF8C00/white?text=PU" class="mx-auto w-28 h-28 object-cover rounded-full"><h3 class="font-bold mt-3">Bao tay phủ PU</h3><p class="text-sm text-gray-500">Êm tay, thoáng khí</p></div>
                        <div class="bg-white p-5 rounded-xl shadow text-center hover:shadow-lg transition cursor-pointer filter-cat" data-cat="chong-cat"><img src="https://placehold.co/150x150/d32f2f/white?text=Chống+cắt" class="mx-auto w-28 h-28 object-cover rounded-full"><h3 class="font-bold mt-3">Bao tay chống cắt</h3><p class="text-sm text-gray-500">An toàn cao</p></div>
                        <div class="bg-white p-5 rounded-xl shadow text-center hover:shadow-lg transition cursor-pointer filter-cat" data-cat="hat-nhua"><img src="https://placehold.co/150x150/2e7d32/white?text=Hạt+nhựa" class="mx-auto w-28 h-28 object-cover rounded-full"><h3 class="font-bold mt-3">Bao tay phủ hạt nhựa</h3><p class="text-sm text-gray-500">Chống trơn trượt</p></div>
                    </div>
                </div>
            </section>

            <!-- Sản phẩm nổi bật (slider) -->
            <section class="py-16 bg-white">
                <div class="container mx-auto px-4">
                    <div class="flex justify-between items-center mb-8"><h2 class="text-3xl font-bold text-[#0F4C81]">Sản phẩm nổi bật</h2><a href="#" data-page="products" class="text-[#FF8C00] text-lg">Xem tất cả →</a></div>
                    <div class="swiper featuredSwiper overflow-hidden"><div class="swiper-wrapper">${featured.map(p => `<div class="swiper-slide"><div class="bg-gray-50 p-5 rounded-xl shadow"><img src="${p.image}" class="h-44 mx-auto object-cover"><h3 class="font-bold text-xl mt-3">${p.name}</h3><p class="text-red-600 font-bold text-xl">${formatPrice(p.price)}</p><button class="btn-add-cart-featured bg-[#0F4C81] text-white px-4 py-2 rounded-full mt-3 w-full" data-id="${p.id}">Mua ngay</button></div></div>`).join('')}</div><div class="swiper-button-next"></div><div class="swiper-button-prev"></div></div>
                </div>
            </section>

            <!-- Video nhà máy full width -->
            <section class="py-16 bg-gray-900 text-white">
                <div class="container mx-auto px-4 text-center">
                    <h2 class="text-3xl font-bold mb-6">Nhà máy sản xuất hiện đại</h2>
                    <div class="max-w-4xl mx-auto">
                        <iframe width="100%" height="450" src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=0" title="Nhà máy" frameborder="0" allowfullscreen class="rounded-2xl shadow-2xl"></iframe>
                    </div>
                </div>
            </section>

            <!-- Lý do chọn chúng tôi (4 box) -->
            <section class="py-16 bg-white">
                <div class="container mx-auto px-4">
                    <h2 class="text-3xl font-bold text-center text-[#0F4C81] mb-10">Lý do chọn chúng tôi</h2>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-6 text-center">
                        <div><i class="fas fa-factory text-5xl text-[#FF8C00]"></i><p class="font-bold text-lg mt-3">Sản xuất trực tiếp</p><p class="text-gray-500">Không qua trung gian</p></div>
                        <div><i class="fas fa-tags text-5xl text-[#FF8C00]"></i><p class="font-bold text-lg mt-3">Giá cạnh tranh</p><p class="text-gray-500">Tốt nhất thị trường</p></div>
                        <div><i class="fas fa-truck-fast text-5xl text-[#FF8C00]"></i><p class="font-bold text-lg mt-3">Giao hàng nhanh</p><p class="text-gray-500">Toàn quốc 24-48h</p></div>
                        <div><i class="fas fa-certificate text-5xl text-[#FF8C00]"></i><p class="font-bold text-lg mt-3">Chất lượng đảm bảo</p><p class="text-gray-500">Đạt chuẩn công nghiệp</p></div>
                    </div>
                </div>
            </section>

            <!-- Feedback khách hàng (slider) -->
            <section class="py-16 bg-gray-100">
                <div class="container mx-auto px-4">
                    <h2 class="text-3xl font-bold text-center text-[#0F4C81] mb-10">Khách hàng nói gì</h2>

        }

        // Trang sản phẩm (giữ nguyên)
        function renderProductsPage(){
            return `<div class="container mx-auto px-4 py-10"><div class="flex flex-col md:flex-row gap-8"><div class="md:w-1/4 bg-white p-5 rounded-xl shadow"><h3 class="font-bold text-2xl mb-4">Bộ lọc</h3><select id="categoryFilter" class="w-full border p-3 rounded mb-4"><option value="all">Tất cả</option><option value="len">Bao tay len</option><option value="hat-nhua">Phủ hạt nhựa</option><option value="chong-cat">Chống cắt</option><option value="phu-pu">Phủ PU</option></select><input type="text" id="searchInputFilter" placeholder="Tìm sản phẩm..." class="w-full border p-3 rounded"></div><div class="md:w-3/4"><div class="grid grid-cols-2 md:grid-cols-3 gap-6" id="productGridContainer"></div></div></div></div>`;
        }
        function renderSimplePage(title, content) {
            return `<div class="container mx-auto px-4 py-20 text-center"><h2 class="text-3xl font-bold text-[#0F4C81]">${title}</h2><p class="text-lg mt-4">${content}</p><div class="mt-6"><a href="#" data-page="home" class="btn-cta text-white px-6 py-3 rounded-lg">Về trang chủ</a></div></div>`;
        }

        function renderProductList(filterCategory = "all", searchQuery = "") {
            let filtered = products.filter(p => (filterCategory === "all" || p.category === filterCategory) && p.name.toLowerCase().includes(searchQuery.toLowerCase()));
            const container = document.getElementById('productGridContainer');
            if(!container) return;
            if(filtered.length===0) { container.innerHTML = '<div class="col-span-full text-center py-12">Không tìm thấy sản phẩm</div>'; return;}
            container.innerHTML = filtered.map(p => `<div class="product-card bg-white rounded-xl shadow-md p-4"><img src="${p.image}" class="w-full h-48 object-cover rounded-lg mb-3"><h3 class="font-bold text-xl">${p.name}</h3><p class="text-red-600 font-bold text-2xl">${formatPrice(p.price)}</p><div class="flex gap-2 mt-3"><button class="btn-add-cart bg-[#0F4C81] text-white px-3 py-2 rounded-full text-sm flex-1" data-id="${p.id}">Mua ngay</button><button class="view-detail-btn border border-[#FF8C00] text-[#FF8C00] px-3 py-2 rounded-full text-sm" data-id="${p.id}">Chi tiết</button></div></div>`).join('');
            attachProductEvents();
        }
        function attachProductEvents(){
            document.querySelectorAll('.btn-add-cart').forEach(btn => btn.addEventListener('click', (e) => { let id = parseInt(btn.closest('.product-card')?.querySelector('.view-detail-btn')?.dataset.id); if(id) addToCart(id,1); }));
            document.querySelectorAll('.view-detail-btn').forEach(btn => btn.addEventListener('click', (e) => { showProductDetail(parseInt(btn.dataset.id)); }));
        }
        function showProductDetail(id){
            const prod = products.find(p => p.id === id);
            if(!prod) return;
            const modalDiv = document.createElement('div');
            modalDiv.className = "fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[1200] p-4";
            modalDiv.innerHTML = `<div class="bg-white max-w-3xl w-full rounded-2xl p-5"><div class="flex justify-between"><h3 class="text-2xl font-bold">${prod.name}</h3><button class="close-modal text-3xl">&times;</button></div><div class="grid md:grid-cols-2 gap-4 mt-3"><img src="${prod.image}"><div><p class="text-3xl text-[#FF8C00] font-bold">${formatPrice(prod.price)}</p><p class="mt-2">Tồn kho: ${prod.stock}</p><button class="btn-add-cart-modal bg-[#0F4C81] text-white px-6 py-2 rounded-full mt-3">Mua ngay</button></div></div></div>`;
            document.body.appendChild(modalDiv);
            modalDiv.querySelector('.close-modal').onclick = () => modalDiv.remove();
            modalDiv.querySelector('.btn-add-cart-modal').onclick = () => { addToCart(prod.id,1); modalDiv.remove(); };
        }

        function attachFilterEvents(){
            const catFilter = document.getElementById('categoryFilter');
            const searchFilter = document.getElementById('searchInputFilter');
            const refresh = () => renderProductList(catFilter?.value || 'all', searchFilter?.value || '');
            if(catFilter) catFilter.addEventListener('change', refresh);
            if(searchFilter) searchFilter.addEventListener('input', refresh);
            refresh();
        }
        function attachHomeEvents(){
            document.querySelectorAll('.filter-cat').forEach(el => el.addEventListener('click', (e) => { let cat = el.dataset.cat; loadPage('products'); setTimeout(()=>{ document.getElementById('categoryFilter').value = cat; renderProductList(cat,''); },50); }));
            document.querySelectorAll('.btn-add-cart-featured').forEach(btn => btn.addEventListener('click', (e)=>{ addToCart(parseInt(btn.dataset.id),1); }));
            document.getElementById('getQuoteBtn')?.addEventListener('click', () => showToast("Liên hệ báo giá sỉ: 033 444 9494 hoặc Zalo 0981 171 750"));
            document.getElementById('ctaQuoteBtn')?.addEventListener('click', () => showToast("Liên hệ báo giá sỉ: 033 444 9494 hoặc Zalo 0981 171 750"));
        }
        function initSwiper(){
            if(document.querySelector('.featuredSwiper')) new Swiper('.featuredSwiper', { slidesPerView: 2, spaceBetween: 20, navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' }, breakpoints: { 768: { slidesPerView: 3 }, 1024: { slidesPerView: 4 } } });
            if(document.querySelector('.testimonialSwiper')) new Swiper('.testimonialSwiper', { slidesPerView: 1, pagination: { el: '.swiper-pagination', clickable: true } });
        }

        function loadPage(page) {
            currentPage = page;
            const main = document.getElementById('appContent');
            if(page === 'home') { main.innerHTML = renderHome(); attachHomeEvents(); initSwiper(); }
            else if(page === 'about') { main.innerHTML = renderAbout(); }
            else if(page === 'products') { main.innerHTML = renderProductsPage(); renderProductList('all',''); attachFilterEvents(); }
            else if(page === 'quote') main.innerHTML = renderSimplePage("Báo giá sỉ", "Quý khách vui lòng liên hệ hotline 033 444 9494 hoặc Zalo 0981 171 750 để nhận báo giá tốt nhất.");
            else if(page === 'news') main.innerHTML = renderSimplePage("Tin tức", "Cập nhật các bài viết về bảo hộ lao động sắp ra mắt.");
            else if(page === 'contact') main.innerHTML = renderSimplePage("Liên hệ", "📞 033 444 9494 - 📱 Zalo 0981 171 750 - 📧 baotay@thuydung.com");
            window.scrollTo({ top: 0 });
        }

        // Xử lý sự kiện menu
        function bindMenuEvents() {
            document.querySelectorAll('.nav-link').forEach(link => {
                link.removeEventListener('click', handleNavClick);
                link.addEventListener('click', handleNavClick);
            });
        }
        function handleNavClick(e) {
            e.preventDefault();
            const page = e.currentTarget.getAttribute('data-page');
            if(page) loadPage(page);
        }
        document.getElementById('cartIconHeader')?.addEventListener('click', () => document.getElementById('cartDrawer')?.classList.remove('translate-x-full'));
        document.getElementById('closeCartBtn')?.addEventListener('click', () => document.getElementById('cartDrawer')?.classList.add('translate-x-full'));
        document.getElementById('checkoutBtn')?.addEventListener('click', () => document.getElementById('checkoutModal').style.display = 'flex');
        document.getElementById('closeCheckout')?.addEventListener('click', () => document.getElementById('checkoutModal').style.display = 'none');
        document.getElementById('checkoutForm')?.addEventListener('submit', (e) => { e.preventDefault(); alert("✅ Đặt hàng thành công! Chúng tôi sẽ liên hệ xác nhận."); cart = []; saveCart(); document.getElementById('checkoutModal').style.display = 'none'; document.getElementById('cartDrawer')?.classList.add('translate-x-full'); });
        setTimeout(() => document.getElementById('discountPopup')?.classList.remove('hidden'), 5000);
        document.getElementById('closePopup')?.onclick = () => document.getElementById('discountPopup')?.classList.add('hidden');
        document.getElementById('popupCta')?.onclick = () => { document.getElementById('discountPopup')?.classList.add('hidden'); showToast("Mã THUYDUNG10: giảm 10% đơn hàng đầu"); };
        window.addEventListener('load', () => { loadPage('home'); updateCartUI(); bindMenuEvents(); });
    </script>
